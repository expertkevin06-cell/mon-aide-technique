name: Mise à jour base rappels

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le repo
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Générer la base
        run: |
          python build_database.py

      - name: Commit et push
        run: |
          git config user.name "Kevin Bot"
          git config user.email "bot@analyse-kevin.local"
          git add data/recalls.json
          git diff --cached --quiet || git commit -m "Mise a jour auto des rappels"
          git push
