name: Mise à jour base rappels

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier version
        run: |
          node --version
          npm --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Construire la base de rappels
        run: python build_database.py

      - name: Valider le JSON généré (Node)
        run: node -e "JSON.parse(require('fs').readFileSync('data/recalls.json','utf8')); console.log('✅ JSON valide')"

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/recalls.json
          git diff --cached --quiet || git commit -m "🔄 Mise à jour automatique des rappels"
          git push
