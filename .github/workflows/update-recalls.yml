name: Mise à jour base rappels

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Construire la base de rappels
        run: python build_database.py

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/recalls.json
          git diff --cached --quiet || git commit -m "🔄 Mise à jour automatique des rappels"
          git push
