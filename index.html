<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dc1e32">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Analyse Technique Kevin</title>
</head>
<body>

<header class="header">
  <div class="header-top">
    <h1>🔧 Analyse Technique Kevin</h1>
    <button id="btn-admin" class="btn-icon">🔐</button>
  </div>
  <div class="filters">
    <select id="filter-marque"><option value="">Toutes les marques</option></select>
    <select id="filter-modele" disabled><option value="">Tous les modèles</option></select>
    <select id="filter-moteur" disabled><option value="">Toutes les motorisations</option></select>
    <button id="btn-reset" class="btn-reset">✖ Réinitialiser</button>
  </div>
  <input type="search" id="search" placeholder="🔎 Rechercher un mot-clé...">
</header>

<main id="results"></main>
<div class="empty-state" id="empty-state">
  <p>📋 Sélectionnez des filtres ou tapez un mot-clé</p>
</div>

<div class="modal-overlay" id="admin-modal">
  <div class="modal-box">
    <button class="modal-close" id="admin-close">✖</button>
    <div id="admin-login-view">
      <h2>🔐 Accès Admin</h2>
      <input type="password" id="admin-pass" placeholder="Mot de passe" autocomplete="off">
      <button id="admin-login" class="btn-primary">Valider</button>
    </div>
    <div id="admin-tools" style="display:none;">
      <h2>🛠️ Outils Admin</h2>
      <button id="btn-share" class="btn-tool">📤 Partager l'application</button>
      <button id="btn-pdf" class="btn-tool">🖨️ Exporter en PDF</button>
      <hr>
      <label class="file-label">📥 Importer données (JSON)
        <input type="file" id="import-json" accept=".json">
      </label>
      <button id="btn-export" class="btn-tool">📤 Exporter données (JSON)</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
