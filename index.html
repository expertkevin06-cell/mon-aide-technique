<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyse technique by Kevin</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🔧 Analyse technique <span>by Kevin</span></h1>
  <button id="btn-admin" onclick="document.getElementById('admin-panel').classList.toggle('hidden')">🔐 Admin</button>
</header>

<div id="admin-panel" class="hidden">
  <input type="password" id="admin-pass" placeholder="Mot de passe admin">
  <button onclick="adminLogin()">Valider</button>
  <div id="admin-tools" class="hidden">
    <button onclick="shareApp()">📤 Partager l'APK</button>
    <button onclick="window.print()">🖨️ Imprimer fiche PDF</button>
    <button onclick="importData()">⬇️ Importer campagnes (JSON)</button>
    <input type="file" id="file-import" accept=".json" class="hidden">
    <h3>Demandes d'accès tiers</h3>
    <ul id="access-requests"></ul>
  </div>
</div>

<section id="search-zone">
  <input type="search" id="q" placeholder="Marque, modèle, code défaut, n° campagne...">
  <select id="filter-energy">
    <option value="">Toutes motorisations</option>
    <option>Essence</option><option>Diesel</option><option>Hybride</option>
    <option>Électrique</option><option>Flexfuel E85</option>
  </select>
  <select id="filter-system">
    <option value="">Tous systèmes</option>
    <option>Moteur</option><option>Boîte de vitesses</option><option>Airbag</option>
    <option>ABS/ESP</option><option>Ceintures</option><option>Électronique</option>
    <option>Batterie haute tension</option><option>Charge DC/AC</option>
  </select>
</section>

<section id="ai-zone">
  <input type="text" id="ai-q" placeholder="🤖 Recherche libre IA : symptôme, panne, code défaut...">
  <button onclick="runAISearch()">Analyser</button>
  <div id="ai-answer" class="hidden"></div>
</section>

<main id="results"></main>

<script src="js/db.js"></script>
<script src="js/admin.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
