<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <title>Analyse Technique Kevin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🔧 Analyse Technique Kevin</h1>
    <p>Rappels & pannes — 2018 à 2026</p>
  </header>

  <main>
    <section class="filtres">
      <label for="marque">Marque :</label>
      <select id="marque"><option value="">Toutes les marques</option></select>

      <label for="modele">Modèle :</label>
      <select id="modele"><option value="">Tous les modèles</option></select>

      <label for="moteur">Motorisation :</label>
      <select id="moteur"><option value="">Toutes motorisations</option></select>

      <input type="text" id="recherche" placeholder="🔎 Mot-clé, code DTC...">
      <button id="btn-reset">Réinitialiser</button>
    </section>

    <section id="resultats"></section>
  </main>

  <footer>
    <p>⚠️ Vérification VIN officielle : ovs.economie.gouv.fr</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
