<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dc1e32">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Analyse Technique Kevin</title>
</head>
<body>

<header>
  <h1>🔧 Analyse Technique</h1>
  <button id="btn-admin">🔐 Admin</button>
</header>

<div class="search-zone">
  <input type="text" id="search-input" placeholder="Marque, modèle, symptôme, code défaut...">
  <div class="filters">
    <select id="filter-brand"><option value="">Toutes marques</option></select>
    <select id="filter-energy">
      <option value="">Tout carburant</option>
      <option>Essence</option><option>Diesel</option><option>Électrique</option>
      <option>Hybride</option><option>Flexfuel E85</option>
    </select>
  </div>
  <button class="primary" id="btn-search">🔍 Rechercher</button>
  <button class="secondary" id="btn-ai">🤖 Demander à l'IA</button>
</div>

<div class="count-bar" id="count-bar">Chargement de la base...</div>

<div class="results" id="results"></div>

<div class="ai-zone" id="ai-zone" style="display:none;">
  <div class="ai-response" id="ai-response"></div>
</div>

<!-- Modal Admin -->
<div class="modal" id="admin-modal">
  <div class="modal-content">
    <h2>🔐 Mode Administrateur</h2>
    <input type="password" id="admin-pass" placeholder="Mot de passe">
    <button class="primary" id="admin-login">Valider</button>
    <div id="admin-tools" style="display:none; margin-top:14px;">
      <button class="primary" id="btn-share">📤 Partager l'app</button>
      <button class="primary" id="btn-pdf" style="margin-top:8px;">🖨️ Imprimer / PDF</button>
      <button class="secondary" id="btn-icons" style="margin-top:8px;">🖼️ Générer les icônes</button>
      <input type="file" id="import-json" accept=".json" style="margin-top:12px; color:#eee;">
    </div>
    <button class="secondary" id="admin-close" style="margin-top:12px;">Fermer</button>
  </div>
</div>

<nav class="bottom-nav">
  <button class="active" data-tab="search">🔍 Recherche</button>
  <button data-tab="ai">🤖 IA</button>
  <button data-tab="info">ℹ️ Infos</button>
</nav>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(console.error);
}
</script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script src="js/ai.js"></script>
</body>
</html>
